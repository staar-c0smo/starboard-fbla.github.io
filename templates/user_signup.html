<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/login.css">
        <title>Sign Up - Starboard</title>
        <style>
            .error-message {
                color: #ef4444;
                font-size: 0.875rem;
                margin-top: 0.5rem;
                display: none;
            }
            .success-message {
                color: #22c55e;
                font-size: 0.875rem;
                margin-top: 0.5rem;
                display: none;
                text-align: center;
            }
            .input-box.error input {
                border-color: #ef4444;
            }
            .password-requirements {
                color: #64748b;
                font-size: 0.75rem;
                margin-top: 0.25rem;
            }
            .btn:disabled {
                opacity: 0.7;
                cursor: not-allowed;
            }
            .loading {
                display: none;
                margin-left: 0.5rem;
            }
        </style>
    </head>
    <body> 
        <h2><a href="homepage.html">STARBOARD</a></h2>
        <div class="wrapper">
            <form id="signupForm">
                <h1>Create Account</h1>
                <div class="input-box">
                    <input type="text" id="fullName" placeholder="Full Name" required minlength="2">
                    <div class="error-message" id="nameError"></div>
                </div>
                <div class="input-box">
                    <input type="email" id="email" placeholder="Email" required>
                    <div class="error-message" id="emailError"></div>
                </div>
                <div class="input-box">
                    <input type="password" id="password" placeholder="Password" required minlength="8">
                    <div class="password-requirements">Password must be at least 8 characters</div>
                    <div class="error-message" id="passwordError"></div>
                </div>
                <div class="input-box">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    <div class="error-message" id="confirmError"></div>
                </div>

                <button type="submit" id="submitButton" class="btn">
                    Create Account
                    <span class="loading">...</span>
                </button>
                
                <div class="success-message" id="successMessage"></div>
                <div class="error-message" id="generalError"></div>

                <div class="register-link">
                    <p>Already have an account? <a href="user_login.html">Login</a></p>
                </div>
            </form>
        </div>

        <script type="module">
            import { auth } from './firebase-config.js';
            import { createUserWithEmailAndPassword, updateProfile } from 'firebase/auth';
            import { getFirestore, doc, setDoc } from 'firebase/firestore';

            const form = document.getElementById('signupForm');
            const submitButton = document.getElementById('submitButton');
            const loadingSpinner = document.querySelector('.loading');
            const successMessage = document.getElementById('successMessage');
            
            // Error message elements
            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            const confirmError = document.getElementById('confirmError');
            const generalError = document.getElementById('generalError');

            function showError(element, message) {
                element.textContent = message;
                element.style.display = 'block';
                element.parentElement.classList.add('error');
            }

            function clearErrors() {
                [nameError, emailError, passwordError, confirmError, generalError].forEach(error => {
                    error.style.display = 'none';
                });
                document.querySelectorAll('.input-box').forEach(box => {
                    box.classList.remove('error');
                });
            }

            // Real-time password match validation
            const passwordInput = document.getElementById('password');
            const confirmInput = document.getElementById('confirmPassword');
            
            function validatePasswords() {
                if (confirmInput.value) {
                    if (passwordInput.value !== confirmInput.value) {
                        showError(confirmError, 'Passwords do not match');
                        return false;
                    } else {
                        confirmError.style.display = 'none';
                        confirmInput.parentElement.classList.remove('error');
                        return true;
                    }
                }
                return true;
            }

            // Check passwords when either input changes
            passwordInput.addEventListener('input', validatePasswords);
            confirmInput.addEventListener('input', validatePasswords);

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearErrors();

                const fullName = document.getElementById('fullName').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmInput.value;

                // Validation
                let hasError = false;
                if (fullName.length < 2) {
                    showError(nameError, 'Name must be at least 2 characters long');
                    hasError = true;
                }
                if (!email.includes('@')) {
                    showError(emailError, 'Please enter a valid email address');
                    hasError = true;
                }
                if (password.length < 8) {
                    showError(passwordError, 'Password must be at least 8 characters long');
                    hasError = true;
                }
                if (password !== confirmPassword) {
                    showError(confirmError, 'Passwords do not match');
                    hasError = true;
                }
                
                // Additional validation to ensure passwords match
                if (!validatePasswords()) {
                    hasError = true;
                }

                if (hasError) return;

                // Disable button and show loading state
                submitButton.disabled = true;
                loadingSpinner.style.display = 'inline';

                try {
                    // Create user account
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    // Update profile with full name
                    await updateProfile(user, {
                        displayName: fullName
                    });

                    // Store additional user data in Firestore
                    const db = getFirestore();
                    await setDoc(doc(db, 'users', user.uid), {
                        name: fullName,
                        email: email,
                        createdAt: new Date().toISOString()
                    });

                    // Show success message
                    successMessage.textContent = 'Account created successfully! Redirecting to login...';
                    successMessage.style.display = 'block';

                    // Redirect to login page after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'user_login.html';
                    }, 2000);

                } catch (error) {
                    console.error('Signup error:', error);
                    
                    switch (error.code) {
                        case 'auth/email-already-in-use':
                            showError(emailError, 'This email is already registered');
                            break;
                        case 'auth/invalid-email':
                            showError(emailError, 'Invalid email address');
                            break;
                        case 'auth/weak-password':
                            showError(passwordError, 'Password is too weak');
                            break;
                        default:
                            showError(generalError, 'An error occurred. Please try again');
                    }

                    // Re-enable button and hide loading state
                    submitButton.disabled = false;
                    loadingSpinner.style.display = 'none';
                }
            });
        </script>
    </body>
</html>
