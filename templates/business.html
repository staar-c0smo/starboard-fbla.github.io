<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Businesses</title>
  <style>
    body { font-family: Arial; background: #f5f6fa; margin: 0; padding: 0; }
    header { background: #004aad; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; }
    nav a { color: white; text-decoration: none; margin-left: 1rem; }
    .filters { display: flex; justify-content: center; gap: 1rem; margin: 1rem; }
    select { padding: 0.5rem; border-radius: 6px; }
    .business-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; padding: 1rem 2rem; }
    .card { background: white; padding: 1rem; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .card h3 { margin: 0.5rem 0; color: #004aad; }
    .deal { color: #27ae60; font-weight: bold; }
    .star { color: #b8b8b8; cursor: pointer; user-select: none; font-size: 1.2rem; }
    .star.selected { color: #FFD700; }
    textarea { width: 100%; margin-top: 0.5rem; padding: 0.5rem; border-radius: 6px; }
    .submit-review-btn { margin-top: 0.5rem; padding: 0.4rem 0.8rem; border: none; border-radius: 6px; cursor: pointer; background: #004aad; color: white; }
    .submit-review-btn:hover { background: #003380; }
    .bookmark-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; color: #ff9800; float: right; }
  </style>
</head>
<body>

<header>
  <h1>Local Businesses</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Businesses</a>
    <a href="#">Admin</a>
  </nav>
</header>

<div class="filters">
  <select id="sortSelect">
    <option value="">Sort By</option>
    <option value="name">Name (A–Z)</option>
    <option value="rating">Rating (High–Low)</option>
  </select>
  <select id="categorySelect">
    <option value="">All Categories</option>
    <option value="food">Food</option>
    <option value="retail">Retail</option>
    <option value="tech">Tech</option>
  </select>
</div>

<div class="business-grid" id="businessGrid"></div>

<script>
const businesses = [
  { name: "Blueberry Cafe", category: "food", deal: "10% off pastries", rating: 4.7, reviews: [] },
  { name: "TechWave Solutions", category: "tech", deal: "Free consultation", rating: 4.9, reviews: [] },
  { name: "Trendy Threads", category: "retail", deal: "Buy 1 Get 1 Half Off", rating: 4.3, reviews: [] },
  { name: "GreenLeaf Market", category: "food", deal: "5% off groceries", rating: 4.6, reviews: [] },
];

const grid = document.getElementById("businessGrid");
const selectedStars = {};

function renderBusinesses(list) {
  grid.innerHTML = "";
  list.forEach(b => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <button class="bookmark-btn" onclick="alert('Bookmarked ${b.name}!')">★</button>
      <h3>${b.name}</h3>
      <p>Category: ${b.category}</p>
      <p class="deal">${b.deal}</p>
      <p>⭐ ${b.rating.toFixed(1)}</p>

      <div class="review-form">
        <div class="stars" id="stars-${b.name}">${[1,2,3,4,5].map(i => `<span class="star" data-value="${i}">★</span>`).join('')}</div>
        <textarea id="reviewText-${b.name}" rows="2" placeholder="Write your review..."></textarea>
        <button class="submit-review-btn" data-name="${b.name}">Submit</button>
      </div>

      <div class="reviews" id="reviews-${b.name}">
        ${b.reviews.map(r => `<p>⭐${r.stars} — ${r.text}</p>`).join('')}
      </div>
    `;


    grid.appendChild(card);

    // Attach star click events
    const starElements = card.querySelectorAll(".star");
    starElements.forEach(star => {
      star.onclick = () => {
        const value = parseInt(star.dataset.value);
        selectedStars[b.name] = value;
        starElements.forEach(s => s.classList.remove("selected"));
        for(let i=0; i<value; i++) starElements[i].classList.add("selected");
      };
    });

    // Attach submit review event
    const submitBtn = card.querySelector(".submit-review-btn");
    submitBtn.onclick = () => {
      const textArea = document.getElementById(`reviewText-${b.name}`);
      const text = textArea.value.trim();
      const stars = selectedStars[b.name];
      if(!text || !stars) return alert("Add both review and star rating");
      b.reviews.push({ text, stars });
      b.rating = b.reviews.reduce((a,r)=>a+r.stars,0)/b.reviews.length;
      textArea.value = "";
      selectedStars[b.name] = null;
      renderBusinesses(businesses);
    };
  });
}

renderBusinesses(businesses);

document.getElementById("sortSelect").addEventListener("change", e => {
  let sorted = [...businesses];
  if(e.target.value === "name") sorted.sort((a,b)=>a.name.localeCompare(b.name));
  if(e.target.value === "rating") sorted.sort((a,b)=>b.rating - a.rating);
  renderBusinesses(sorted);
});

document.getElementById("categorySelect").addEventListener("change", e => {
  const filtered = e.target.value ? businesses.filter(b=>b.category===e.target.value) : businesses;
  renderBusinesses(filtered);
});
</script>
</body>
</html>
