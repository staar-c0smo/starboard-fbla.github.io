<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starboard</title>
  <link rel="stylesheet" type="text/css" href="css/homepage.css">
</head>
<body>
  <header>
    <a href="#" class="logo">Starboard</a>
    <nav></nav>
  </header>

  <div class="wrapper">
    <section class="hero">
      <div class="primary"></div>
    </section>

    <section class="sidebar">
      <div class="inner">
        <div class="clipper">
          <section class="hero">
            <h2>Support Local. Discover Hidden Gems.</h2>
            <p>Find, review, and share your favorite small businesses in your community.</p>
          </section>
          <div class="anim-panel"></div>
        </div>
      </div>
    </section>

    <section class="signup">
      <div class="inner">
        <div class="clipper"></div>
        <div class="anim-panel">
          <button class="cta" id="getStartedBtn" onclick="proceed()">Get Started</button>
        </div>
      </div>
    </section>
  </div>

  <script>
    // Navigate to login page
    function proceed() {
      window.location.href = 'login.html'; // Change to your login page path
    }

    // GSAP animations
    document.addEventListener("DOMContentLoaded", function() {
      window.addEventListener("load", function() {
        document.body.style.display = "block";

        var tl = gsap.timeline();
        tl.staggerFrom('section', 2, { opacity: 0, scale: 0.5, ease: "power2.out" }, 0.2);
        tl.staggerFrom('h1, h2', 0.5, { opacity: 0, y: -40, ease: "power2.inOut" }, 0.2, "-=2");
        tl.staggerFrom('.anim-panel', 1, { opacity: 0, y: -40, ease: "power2.inOut" }, 0.2, "-=1.5");
      });
    });
  </script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
