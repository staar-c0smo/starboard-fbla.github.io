<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/login.css">
        <title>Login - Starboard</title>
    </head>
    <body> 
        <h2><a href="homepage.html">STARBOARD</a></h2>
        <div class="wrapper">
            <form action="">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                </div>

                <div class="remember-forgot">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#">Forgot password?</a>
                </div>
                <button type="submit" class="btn" onclick="window.location.href='business.html'; return false;">Login</button>
                <div class="register-link">
                    <p>Don't have an account? <a href="user_signup.html">Register</a></p>
                </div>
            </form>
        </div>
    </body>
</html>
