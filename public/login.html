<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Starboard</title>
  <link rel="stylesheet" href="css/login.css" />
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
  <header>
    <a href="index.html" class="logo">Starboard</a>
    <nav>
      <ul>
        <li><a href="help.html">FAQ</a></li>
        <li><a href="index.html">Home</a></li>
        <li><a href="business.html">Businesses</a></li>
      </ul>
    </nav>
  </header>

  <div class="wrapper">
    <section>
      <h1>Login & Signup</h1>
      <p>Sign in or sign up to access business listings and reviews</p>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required style="width: 100%; padding: 0.8em; margin-bottom: 1em;">
        <input type="password" id="password" placeholder="Password" required style="width: 100%; padding: 0.8em; margin-bottom: 1em;">
        <div class="g-recaptcha" data-sitekey="6LfYvgksAAAAAIhbGjMHykTr98TNnLmPdrJ9tY9k"></div>
        <button type="submit" style="margin-top: 1em; padding: 0.8em 2em;">Login or Signup</button>
      </form>

      <button id="adminRedirectBtn" type="button" class="admin-btn">
        Go to Admin Login
      </button>
      <p id="loginMessage"></p>
    </section>
  </div>

  <!-- Firebase login JS -->
  <script type="module" src="js/firebase-login.js"></script>
  <script>
    // Redirect admin button to adminlogin.html
    const adminBtn = document.getElementById('adminRedirectBtn');
    adminBtn.addEventListener('click', () => {
      window.location.href = 'adminlogin.html';
    });
  </script>
</body>
</html>
