<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Businesses</title>
  <link rel="stylesheet" href="css/business.css">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>

<header>
  <h1>Starboard</h1>
  <nav>
    <a href="help.html">FAQ</a>
    <a href="index.html">Home</a>
    <a href="business.html">Businesses</a>
    
  </nav>
</header>

<div class="filters">
  <select id="sortSelect">
    <option value="">Sort By</option>
    <option value="name">Name (A–Z)</option>
    <option value="rating">Rating (High–Low)</option>
  </select>
  <select id="categorySelect">
    <option value="">All Categories</option>
    <option value="food">Food</option>
    <option value="retail">Retail</option>
    <option value="tech">Tech</option>
    <option value="favorites">Favorites</option>
  </select>
</div>

<div class="business-layout">

  <div class="business-list">
    <div class="business-grid" id="businessGrid"></div>
  </div>

  <div class="map-container">
    <div id="map"></div>
  </div>

</div>

<div id="businessDetail" class="business-detail hidden"></div>

<!-- Firebase + Business Script -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="js/business.js"></script>
</body>
</html>
